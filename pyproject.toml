[project]
name = "fd-agent-graph"
version = "0.1.0"
description = "Runtime-agnostic agent-graph engineering toolkit: typed ports, effect checking, topology analysis and a graph-level CI gate."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
fd-agent-graph = "fd_agent_graph.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fd_agent_graph*"]
